name: closet_app
description: Weather-based outfit recommendation app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Local DB
  sqflite: any

  # State Management
  flutter_riverpod: any
  riverpod_annotation: any

  # Navigation
  go_router: any

  # Image Processing
  image_picker: any
  image_cropper: any
  image: any
  camera: any
  google_mlkit_selfie_segmentation: any

  # Location & Weather
  geolocator: any
  http: any

  # Local Storage / Cache
  shared_preferences: any

  # UI Utilities
  flutter_svg: any
  shimmer: any
  intl: any

  # Utils
  uuid: any
  path_provider: any
  path: any
  freezed_annotation: any
  json_annotation: any
  collection: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_generator: any
  mockito: any
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/characters/

flutter_native_splash:
  color: "#6C5CE7"
  color_dark: "#2D3436"
  image: assets/images/splash_icon.png
  image_dark: assets/images/splash_icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#6C5CE7"
    color_dark: "#2D3436"
    image: assets/images/splash_icon.png
    image_dark: assets/images/splash_icon.png
    icon_background_color: "#6C5CE7"
    icon_background_color_dark: "#2D3436"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
